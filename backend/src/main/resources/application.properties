spring.application.name=${SPRING_APPLICATION_NAME:smart-performance-analyzer}
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.OracleDialect}
spring.jpa.database-platform=org.hibernate.dialect.Oracle10gDialect

spring.jackson.serialization.write-dates-as-timestamps=${JACKSON_WRITE_DATES_AS_TIMESTAMPS:false}

huggingface.api-url=${HF_API_URL:https://router.huggingface.co/v1/chat/completions}
huggingface.model=${HF_MODEL:openai/gpt-oss-120b:fastest}
huggingface.token=${HF_TOKEN:}
huggingface.enabled=${HF_ENABLED:false}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

